<html lang="ja">

<title>Darts&foodbar TORIN｜仙台・河原町</title>
<meta name="description" content="Darts&foodbar TORIN（仙台・河原町）。出会えてよかった。そう思える夜を。">
</head>
<body>
<style>
  :root{
    --cream:#FBF1E1;      /* 名刺の地色 */
    --cream2:#F6E8D3;
    --orange:#F0821F;     /* 名刺のオレンジ */
    --orange-d:#E06E12;
    --brown:#3B2A1B;      /* 墨（濃茶） */
    --sub:#8B7355;        /* 補助テキスト */
    --line:#06C755;       /* LINE 公式グリーン */
    --border:rgba(59,42,27,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    color:var(--brown);
    background:var(--cream);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  }
  .app{
    position:relative;width:100%;max-width:460px;height:100dvh;
    display:flex;flex-direction:column;
    padding:20px 20px calc(18px + env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 1.5px 1.5px, rgba(59,42,27,.06) 1.5px, transparent 1.6px) 0 0/22px 22px,
      radial-gradient(130% 60% at 50% -6%, #FFF6EA 0%, var(--cream) 46%, var(--cream2) 100%);
  }

  /* ===== 上：店名（名刺の丸枠ピル） ===== */
  .head{flex:0 0 auto;text-align:center}
  .pill{
    display:inline-flex;align-items:baseline;gap:10px;
    padding:11px 26px;border-radius:999px;
    background:#fff;border:2.5px solid var(--orange);
    box-shadow:0 8px 20px rgba(224,110,18,.16);
  }
  .pill .en{
    font-family:"Hiragino Mincho ProN","Times New Roman",serif;
    font-style:italic;font-weight:700;font-size:20px;letter-spacing:.01em;
    color:var(--orange-d);
  }
  .pill .jp{
    font-family:"Hiragino Mincho ProN","Times New Roman",serif;
    font-weight:700;font-size:25px;letter-spacing:.04em;color:var(--brown);
  }
  .catch{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    margin-top:12px;font-size:13px;line-height:1.6;letter-spacing:.1em;
    color:var(--brown);font-weight:600;
  }

  /* ===== 中：動画（9:16フル表示・切り取りなし） ===== */
  .movie{
    flex:1 1 auto;min-height:0;margin:14px 0 12px;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .movie video{
    height:100%;width:auto;max-width:100%;max-height:100%;
    aspect-ratio:9/16;object-fit:contain;display:block;
    border-radius:18px;background:#120c06;
    box-shadow:0 12px 30px rgba(59,42,27,.22);
    border:3px solid #fff;outline:1px solid var(--border);
  }
  .mute{
    position:absolute;bottom:12px;right:calc(50% - 42vw);z-index:3;
    width:38px;height:38px;border:none;border-radius:50%;
    background:rgba(18,12,6,.55);color:#fff;font-size:16px;line-height:38px;text-align:center;
    backdrop-filter:blur(4px);cursor:pointer;
  }

  /* ===== 下：連絡先 ===== */
  .info{flex:0 0 auto;text-align:center}
  .info .owner{font-size:14px;color:var(--brown);letter-spacing:.06em}
  .info .owner em{font-style:normal;color:var(--orange-d);font-size:10px;font-weight:800;letter-spacing:.14em;margin-right:8px}
  .info .addr{font-size:11.5px;color:var(--sub);margin-top:6px;letter-spacing:.02em}
  .info .addr .dot{color:var(--orange);margin:0 6px}
  .info .tel{
    display:inline-flex;align-items:center;gap:9px;margin-top:12px;
    color:var(--brown);text-decoration:none;font-size:26px;font-weight:800;letter-spacing:.02em;
  }
  .info .tel svg{width:19px;height:19px;fill:var(--orange-d)}
  .divline{width:86%;height:1px;background:rgba(59,42,27,.14);margin:15px auto 13px}
  .sns{display:flex;gap:30px;justify-content:center}
  .sns a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none}
  .sns .ic{
    width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(59,42,27,.12);
  }
  .sns .ic.line{background:var(--line)}
  .sns .ic.insta{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
  .sns .ic svg{width:26px;height:26px;fill:#fff}
  .sns .lbl{color:var(--sub);font-size:9.5px;letter-spacing:.18em;font-weight:700}
</style>
