  }
  .app{
    position:relative;width:100%;max-width:460px;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:12px 18px calc(16px + env(safe-area-inset-bottom));
    background:transparent;
  }

  /* ===== 上：店名ロゴ（プレート） ===== */
  .head{flex:0 0 auto;text-align:center}
  .brandcard{
    display:inline-block;background:#fff;
    border:2px solid var(--orange);border-radius:14px;
    padding:6px 12px;box-shadow:0 6px 16px rgba(224,110,18,.18);
  }
  .brandlogo{display:block;width:min(226px,60vw);height:auto}
  .catch{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    margin-top:7px;font-size:12px;line-height:1.5;letter-spacing:.09em;
    color:var(--brown);font-weight:600;
  }

  /* ===== 中：動画（9:16フル表示・切り取りなし）＋両サイドに小さいキャラ ===== */
  .movie{
    flex:0 0 auto;margin:10px 0 12px;
    display:flex;align-items:center;justify-content:center;position:relative;
    overflow:visible;
  }
  .movie video{
    position:relative;z-index:1;
    width:100%;height:auto;
    aspect-ratio:9/16;object-fit:contain;display:block;
    border-radius:18px;background:#120c06;
    box-shadow:0 14px 34px rgba(59,42,27,.26);
    border:3px solid #fff;outline:1px solid var(--border);
  }
  /* 左右の隙間に1体ずつ小さく配置（右は動画側を向くよう反転） */
  .movie .side{
    position:absolute;top:44%;z-index:2;pointer-events:none;
    width:66px;height:auto;
    filter:drop-shadow(0 5px 10px rgba(59,42,27,.32));
  }
  .movie .side.l{left:-17px;transform:translateY(-50%)}
  .movie .side.r{right:-17px;transform:translateY(-50%) scaleX(-1)}
  @media (max-width:360px){ .movie .side{width:56px} }
  .mute{
    position:absolute;bottom:12px;right:12px;z-index:3;
    width:38px;height:38px;border:none;border-radius:50%;
    background:rgba(18,12,6,.55);color:#fff;font-size:16px;line-height:38px;text-align:center;
    backdrop-filter:blur(4px);cursor:pointer;
  }

  /* ===== 下：連絡先（1項目ずつ枠で囲む） ===== */
  .details{
    flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:1px;
  }
  .chip{
    display:flex;align-items:center;gap:8px;text-decoration:none;min-width:0;
    padding:6px 9px;border:2px solid var(--orange);border-radius:12px;
    background:rgba(255,251,244,.92);box-shadow:0 3px 9px rgba(224,110,18,.12);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:transform .06s ease;
  }
  a.chip:active{transform:scale(.98)}
  .chip.full{grid-column:1 / -1}
  .chip .ic{
    flex:0 0 28px;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    box-shadow:0 3px 8px rgba(224,110,18,.28);
  }
  .chip .ic svg{width:16px;height:16px}
  .chip .ic.line{background:var(--line)}
  .chip .ic.ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
  .chip .tx{display:flex;flex-direction:column;line-height:1.18;text-align:left;min-width:0}
  .chip .tx small{font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--orange-d)}
  .chip .tx b{font-size:12.5px;color:var(--brown);font-weight:700}
  .chip.addr .tx b{font-size:11.5px;line-height:1.25}
  .chip.tel .tx b{font-size:18px;letter-spacing:.02em}
  .chip .arrow{margin-left:auto;flex:0 0 auto;color:var(--orange-d);font-size:22px;font-weight:700;line-height:1;padding-left:4px}
</style>
