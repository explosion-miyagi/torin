<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF1E1">
<title>Darts&foodbar TORIN｜仙台・河原町</title>
<meta name="description" content="Darts&foodbar TORIN（仙台・河原町）。出会えてよかった。そう思える夜を。">
</head>
<body>
<style>
  :root{
    --cream:#FBF1E1;      /* 名刺の地色 */
    --cream2:#F6E8D3;
    --orange:#F0821F;     /* 名刺のオレンジ */
    --orange-d:#E06E12;
    --brown:#3B2A1B;      /* 墨（濃茶） */
    --sub:#8B7355;        /* 補助テキスト */
    --line:#06C755;       /* LINE 公式グリーン */
    --card:rgba(255,255,255,.78);
    --border:rgba(59,42,27,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--brown);
    background:var(--cream);
  }
  .app{
    position:relative;
    min-height:100dvh;
    width:100%;
    max-width:480px;
    margin:0 auto;
    overflow:hidden;
    background:
      radial-gradient(circle at 1.5px 1.5px, rgba(59,42,27,.06) 1.5px, transparent 1.6px) 0 0/22px 22px,
      radial-gradient(120% 60% at 50% -8%, #FFF6EA 0%, var(--cream) 46%, var(--cream2) 100%);
  }
  /* 上部の淡いオレンジのアクセント帯（名刺の左オレンジ面のニュアンス） */
  .app::before{
    content:"";position:absolute;left:0;right:0;top:0;height:280px;z-index:0;
    background:radial-gradient(140% 100% at 50% 0%, rgba(240,130,31,.16) 0%, rgba(240,130,31,0) 60%);
    pointer-events:none;
  }
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;
    min-height:100dvh;padding:20px 18px 22px;}

  /* ===== ヘッダー ロゴ ===== */
  .logo{
    width:198px;margin:2px auto 0;display:block;
    filter:drop-shadow(0 10px 22px rgba(59,42,27,.16));
  }
  .catch{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    text-align:center;margin-top:8px;
    font-size:16px;line-height:1.7;letter-spacing:.06em;color:var(--brown);font-weight:600;
  }
  .catch .sep{
    display:block;width:44px;height:3px;border-radius:3px;margin:11px auto 0;
    background:linear-gradient(90deg,var(--orange),var(--orange-d));
  }

  /* ===== 動画（お店のストーリー） ===== */
  .video{
    position:relative;margin:16px 0 2px;border-radius:20px;overflow:hidden;
    background:#120c06;max-height:52vh;
    box-shadow:0 16px 38px rgba(59,42,27,.22);
    border:3px solid #fff;outline:1px solid var(--border);
  }
  .video video{
    display:block;width:100%;max-height:calc(52vh - 6px);
    object-fit:contain;background:#120c06;
  }
  .vtag{
    position:absolute;left:12px;top:12px;z-index:3;
    display:flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;
    color:#fff;background:rgba(224,110,18,.92);backdrop-filter:blur(4px);
    box-shadow:0 4px 12px rgba(224,110,18,.4);
  }
  .vtag i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;
    animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .mute{
    position:absolute;right:11px;bottom:11px;z-index:3;
    width:40px;height:40px;border:none;border-radius:50%;
    background:rgba(18,12,6,.6);color:#fff;font-size:17px;line-height:40px;text-align:center;
    backdrop-filter:blur(4px);cursor:pointer;
  }

  /* ===== 連絡先カード ===== */
  .card{
    margin-top:15px;padding:14px 14px 15px;border-radius:20px;
    background:var(--card);border:1px solid var(--border);
    backdrop-filter:blur(12px) saturate(1.05);-webkit-backdrop-filter:blur(12px) saturate(1.05);
    box-shadow:0 12px 30px rgba(59,42,27,.1);
  }
  /* 情報行（名刺のアイコン丸＋ラベル＋本文） */
  .info{display:flex;align-items:center;gap:12px;padding:9px 6px;}
  .info + .info{border-top:1px dashed rgba(59,42,27,.14)}
  .info .ic{
    flex:0 0 40px;width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 12px rgba(224,110,18,.32);
  }
  .info .ic svg{width:20px;height:20px}
  .info .tx{display:flex;flex-direction:column;line-height:1.35}
  .info .tx small{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--orange-d)}
  .info .tx b{font-size:15px;font-weight:700;color:var(--brown);margin-top:1px}
  .info .tx b.sm{font-size:14px}
  a.info{text-decoration:none}
  a.info:active{transform:scale(.99)}

  /* ボタン群 */
  .actions{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:15px 14px;border-radius:14px;text-decoration:none;
    font-size:16px;font-weight:800;letter-spacing:.03em;
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn svg{width:22px;height:22px;flex:0 0 22px}
  .btn.line{background:var(--line);color:#fff;box-shadow:0 8px 18px rgba(6,199,85,.32)}
  .btn.tel{background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;box-shadow:0 8px 18px rgba(224,110,18,.34)}
  .btn.insta{background:#fff;color:var(--brown);border:1.5px solid var(--border)}
  .btn.insta .ig{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .foot{margin-top:18px;text-align:center;font-size:10px;color:var(--sub);letter-spacing:.16em}
  .foot b{display:block;font-size:11px;letter-spacing:.24em;color:var(--orange-d);margin-bottom:3px;font-weight:800}
</style>
